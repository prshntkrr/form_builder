name: Deploy Eagrology

on:
  push:
    branches:
      - master

# The backend only. The frontend is built and published by something else, so
# nothing here touches it — see the note at the end of the script.

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          port: 22
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          # Both health checks wait, and the frontend stage runs `npm install`
          # and a full bundle build. The default 10 minutes is not enough.
          #
          # This used to say the crop ontology import needed the time, which it
          # did — that import no longer runs on deploy; see the note beside it.
          command_timeout: 30m

          script: |
            set -e

            echo "================================="
            echo "Starting deployment"
            echo "================================="

            cd /var/www/html/eagrology-revamp.indevconsultancy.in/form_builder

            echo "Pulling latest code..."
            git pull origin master
            echo "Now at: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"

            echo "Entering backend..."
            cd backend

            echo "Installing Python dependencies..."
            source venv/bin/activate
            pip install -r requirements.txt

            echo "Checking the new code can actually start..."

            # Before anything destructive. `git pull` can deliver a tree that
            # does not import — a new module committed without its file is the
            # usual way, since `git commit -am` stages modified files and not new
            # ones. Without this the deploy kills a working backend, starts a
            # broken one, and only then discovers the problem: the failure is
            # reported correctly and the site is down anyway.
            #
            # Importing app.main is not enough on its own: a module that fails
            # to import is skipped so the rest of the application still serves,
            # so `import app.main` succeeds with the whole forms module missing.
            # `registry.failures()` is what says so. It touches no data — the
            # database work happens in the lifespan handler, which only runs
            # when uvicorn serves.
            if ! python - > /tmp/eagrology_import.log 2>&1 <<'PREFLIGHT'
            import sys
            import app.main  # noqa: F401  (registers every module)
            from app.core import registry

            broken = registry.failures()
            if broken:
                for name, why in broken.items():
                    print(f"{name}: {why}")
                sys.exit(1)
            print("modules loaded:", ", ".join(m.name for m in registry.modules()))

            # What this installation is set up to do, before it is asked to do
            # it. Every one of these is optional and none is fatal — the
            # application runs without them — but each fails at a distance when
            # it is missing: uploads answer 503, an export refuses, and somebody
            # spends an afternoon on it. Names and states only; no secret is
            # printed, and `set -x` is never on in this script.
            from app.core.config import settings

            print("configuration:")
            print("  S3 bucket        :", settings.aws_s3_bucket or "NOT SET — uploads will answer 503")
            print("  AWS region       :", settings.aws_region,
                  "(must be the bucket's own region, or a browser upload gets a 307 it cannot follow)")
            print("  AWS credentials  :",
                  "from settings" if settings.aws_access_key_id
                  else "from the boto3 chain (instance role/profile/environment)")
            print("  MCDC endpoint    :", settings.mcdc_base_url or "NOT SET — exporting will refuse")
            print("  MCDC key         :", "set" if settings.mcdc_api_key else "NOT SET")
            print("  Gateway          :",
                  f"{'on' if settings.mcdc_gateway_enabled else 'OFF'}, "
                  f"{settings.mcdc_gateway_rate_limit}/{settings.mcdc_gateway_rate_window_seconds}s "
                  f"per caller, body <= {settings.mcdc_gateway_max_body_mb} MB")
            print("  OpenAI key       :", "set" if settings.openai_api_key else "NOT SET — the AI builder is off")
            PREFLIGHT
            then
                echo "The new code does not load cleanly. Nothing has been changed —"
                echo "the running backend is untouched and still serving."
                echo ""
                tail -30 /tmp/eagrology_import.log
                exit 1
            fi
            cat /tmp/eagrology_import.log

            # ===============================================================
            # Vocabulary imports — OFF on purpose.
            #
            # SEOnt, ICASA and the crop ontologies are already loaded on this
            # installation. Every one of them is idempotent, so running them
            # again on each deploy changes nothing and costs minutes: the crop
            # ontology import fetches from cropontology.org, which is why this
            # job asks for a 30-minute timeout in the first place.
            #
            # A FRESH DATABASE STILL NEEDS THEM, once, by hand:
            #
            #     cd backend && source venv/bin/activate
            #     python import_ontology.py
            #     python import_icasa.py
            #     python import_crop_ontology.py --all
            #
            # Without that, the Standards and crop pickers find nothing — a
            # quiet, confusing emptiness rather than an error. Uncomment the
            # block below to put them back in the deploy.
            # ===============================================================

            # echo "Importing standards (SEOnt, ICASA)..."
            #
            # python import_ontology.py || echo "WARNING: ontology import failed, continuing"
            # python import_icasa.py || echo "WARNING: ICASA import failed, continuing"
            #
            # echo "Importing crop ontologies..."
            #
            # Which crops this installation offers: the CROP_ONTOLOGIES
            # repository variable, space-separated ("CO_322 CO_320"), or "all".
            #
            # CROP_ONTOLOGIES="${{ vars.CROP_ONTOLOGIES }}"
            # CROP_ONTOLOGIES="${CROP_ONTOLOGIES:-all}"
            #
            # if [ "$CROP_ONTOLOGIES" = "all" ]; then
            #     echo "  every published ontology"
            #     python import_crop_ontology.py --all             #       || echo "WARNING: crop ontology import failed, continuing"
            # else
            #     for CROP in $CROP_ONTOLOGIES; do
            #         echo "  $CROP"
            #         python import_crop_ontology.py --crop "$CROP"             #           || echo "WARNING: crop ontology $CROP failed, continuing"
            #     done
            # fi

            # ISO 3166-1 and the units table were never here: both are datasets
            # held in the repository and seeded by their module when the backend
            # starts, so they load on every deploy regardless of the above.

            echo "Importing client catalogs..."

            # Every workbook committed under data_dictionary/client_catalogs/.
            # These lists belong to the client, so adding one is a commit rather
            # than a command run on the server. No workbooks is not an error.
            python import_client_catalog.py --directory \
              || echo "WARNING: client catalog import failed, continuing"

            echo "Stopping existing backend..."

            BACKEND_PID=$(ss -ltnpH 'sport = :8021' 2>/dev/null \
              | grep -oP 'pid=\K[0-9]+' \
              | head -1 || true)

            if [ -n "$BACKEND_PID" ]; then
                echo "Found backend PID: $BACKEND_PID"
                kill "$BACKEND_PID"

                echo "Waiting for backend to stop..."

                for i in {1..10}; do
                    if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
                        echo "Backend stopped."
                        break
                    fi
                    sleep 1
                done

                # Still holding the port after ten seconds. Starting anyway would
                # give a second uvicorn that cannot bind, and a health check that
                # passes against the *old* build — a deploy that reports success
                # and changes nothing.
                if kill -0 "$BACKEND_PID" 2>/dev/null; then
                    echo "Backend did not stop; forcing it."
                    kill -9 "$BACKEND_PID" || true
                    sleep 2
                fi
            else
                echo "No process listening on port 8021."
            fi

            echo "Starting backend..."

            # Appended, not truncated. The log of the deploy that broke is the
            # one worth having, and `>` threw it away at the start of the next.
            {
                echo ""
                echo "===== started $(date --iso-8601=seconds) at $(git rev-parse --short HEAD)"
            } >> backend.log

            # One worker, and this is not an oversight. The gateway's rate
            # limiter counts inside one process: two workers would each count to
            # the limit and let twice as much through. Before adding `--workers`
            # or a second instance, put a shared counter behind `RateLimiter` —
            # see MCDC_GATEWAY.md, which says what that takes.
            nohup venv/bin/uvicorn app.main:app \
              --host 0.0.0.0 \
              --port 8021 \
              >> backend.log 2>&1 &

            echo "Checking backend..."

            # Ask the application, not the process table. The backend deliberately
            # stays up when Postgres is unreachable so that /api/health can say
            # so — which means a running process proves nothing. Health reports
            # the connection *and* any table a module's migration did not create,
            # so this catches a bad migration as well as a bad start.
            HEALTH=""
            for i in {1..20}; do
                HEALTH=$(curl -fsS --max-time 5 http://127.0.0.1:8021/api/health 2>/dev/null || true)
                [ -n "$HEALTH" ] && break
                sleep 2
            done

            if [ -z "$HEALTH" ]; then
                echo "Backend did not answer on port 8021."
                echo "Last backend logs:"
                tail -50 backend.log
                exit 1
            fi

            echo "Health: $HEALTH"

            # The startup migrations, as they reported themselves. They are
            # idempotent and say nothing on a second run, so this is empty on
            # every deploy but the one that changed something — which is the one
            # worth being able to read afterwards.
            echo "Schema and seed work on this start:"
            grep -aE "Granted|form_export gained|ISO 3166-1|Created (form table|survey sequence)|Creating missing table" \
              backend.log | tail -20 || echo "  (nothing to do — the database was already current)"

            case "$HEALTH" in
                *'"status":"ok"'*)
                    echo "Backend is running and the database is complete."
                    ;;
                *)
                    # Up, and answering — but something is missing. Left running
                    # on purpose: the screens explain themselves better than a
                    # dead port does, and the deploy is marked failed so nobody
                    # has to notice on their own.
                    echo "Backend started but reports a problem — see missing_tables above."
                    echo "Last backend logs:"
                    tail -50 backend.log
                    exit 1
                    ;;
            esac

            echo "================================="
            echo "Frontend"
            echo "================================="

            cd ../frontend

            # `npm install` rather than `npm ci`: asked for, and it tolerates a
            # lockfile that has drifted from package.json. `npm ci` would be the
            # reproducible choice once the two are known to agree.
            echo "Installing frontend dependencies..."
            npm install

            # The bundle is built even though the dev server below serves from
            # source: a build is what catches an import that does not resolve or
            # a file that does not parse, and it fails here — before the running
            # frontend is stopped — rather than after.
            echo "Building the bundle..."
            npm run build

            echo "Stopping existing frontend..."

            FRONTEND_PID=$(ss -ltnpH 'sport = :8020' 2>/dev/null               | grep -oP 'pid=\K[0-9]+'               | head -1 || true)

            if [ -n "$FRONTEND_PID" ]; then
                echo "Found frontend PID: $FRONTEND_PID"
                kill "$FRONTEND_PID"

                echo "Waiting for frontend to stop..."

                for i in {1..10}; do
                    if ! kill -0 "$FRONTEND_PID" 2>/dev/null; then
                        echo "Frontend stopped."
                        break
                    fi
                    sleep 1
                done

                # Still holding the port. Starting anyway would give a second
                # vite that cannot bind, and a check that passes against the
                # *old* one — a deploy that reports success and changes nothing.
                if kill -0 "$FRONTEND_PID" 2>/dev/null; then
                    echo "Frontend did not stop; forcing it."
                    kill -9 "$FRONTEND_PID" || true
                    sleep 2
                fi
            else
                echo "No process listening on port 8020."
            fi

            echo "Starting frontend..."

            nohup npm run dev -- --host 0.0.0.0 --port 8020 > frontend.log 2>&1 &

            echo "Checking frontend..."

            # Ask the port, not the process table: `npm run dev` stays up as a
            # process while vite behind it has already exited, so a running
            # process proves nothing. Without this a dead dev server would still
            # report a successful deploy.
            FRONTEND_UP=""
            for i in {1..20}; do
                if curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8020/ 2>/dev/null; then
                    FRONTEND_UP="yes"
                    break
                fi
                sleep 2
            done

            if [ -z "$FRONTEND_UP" ]; then
                echo "Frontend did not answer on port 8020."
                echo "Last frontend logs:"
                tail -50 frontend.log
                exit 1
            fi

            echo "================================="
            echo "Deployment completed successfully"
            echo "================================="
            echo "Backend on 8021, frontend on 8020."
